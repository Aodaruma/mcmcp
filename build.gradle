import java.util.jar.JarFile

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

tasks.named('processResources', ProcessResources).configure {
    from('docs/MCMCP_MCP_Tool_Catalog.json') {
        into 'mcmcp'
    }
}

sourceSets {
    harness
    harnessTest {
        java.setSrcDirs(['src/harness/test/java'])
        resources.setSrcDirs([])
    }
    adminBridge
    adminBridgeTest {
        java.setSrcDirs(['src/adminBridge/test/java'])
        resources.setSrcDirs([])
    }
}

configurations {
    harnessImplementation.extendsFrom implementation
    harnessRuntimeOnly.extendsFrom runtimeOnly
    adminBridgeImplementation.extendsFrom implementation
    adminBridgeRuntimeOnly.extendsFrom runtimeOnly
    adminBridgeTestImplementation.extendsFrom adminBridgeImplementation
    adminBridgeTestRuntimeOnly.extendsFrom adminBridgeRuntimeOnly
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    // The official binary-patch pipeline avoids a 4 GiB decompiler process and is
    // sufficient for compiling and testing this client mod on constrained machines.
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    addModdingDependenciesTo sourceSets.harness
    addModdingDependenciesTo sourceSets.adminBridge

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${fixture_mod_id}" {
            sourceSet sourceSets.harness
        }
        "${admin_bridge_mod_id}" {
            sourceSet sourceSets.adminBridge
        }
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            loadedMods = [mods."${mod_id}"]
            def conformanceTest = providers.systemProperty('mcmcp.conformanceTest')
            if (conformanceTest.isPresent()) {
                systemProperty 'mcmcp.conformanceTest', conformanceTest.get()
            }
        }

        harnessClient {
            client()
            gameDirectory = file('run/harness-client')
            loadedMods = [mods."${mod_id}", mods."${fixture_mod_id}"]
            systemProperty 'mcmcp.testHarness', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', fixture_mod_id

            def phase3Mode = providers.gradleProperty('mcmcpFixturePhase3Mode')
                    .map { value -> value.strip().toLowerCase(Locale.ROOT) }
            if (phase3Mode.isPresent()) {
                def requestedMode = phase3Mode.get()
                def supportedModes = [
                        'navigate', 'break', 'place', 'lever', 'cow', 'reset',
                        'all_satisfied', 'mutations', 'waterlogged', 'directional_stairs',
                        'directional_stairs_matrix', 'hopper', 'shortage', 'divergence',
                        'hidden', 'build_runner',
                        'creative_capture'
                ]
                if (!supportedModes.contains(requestedMode)) {
                    throw new GradleException(
                            "Unsupported mcmcpFixturePhase3Mode '${requestedMode}'; expected one of ${supportedModes}")
                }

                programArgument '--quickPlaySingleplayer'
                programArgument 'New World'
                systemProperty 'mcmcp.fixture.phase3.mode', requestedMode
            }

            def phase5Mode = providers.gradleProperty('mcmcpFixturePhase5Mode')
                    .map { value -> value.strip().toLowerCase(Locale.ROOT) }
            if (phase5Mode.isPresent()) {
                if (phase3Mode.isPresent()) {
                    throw new GradleException(
                            'mcmcpFixturePhase3Mode and mcmcpFixturePhase5Mode are mutually exclusive')
                }
                def requestedMode = phase5Mode.get()
                def supportedModes = [
                        'recipes', 'craft', 'smelt', 'warehouse_smelt', 'brew', 'redstone', 'transfer',
                        'container_batch_success', 'container_batch_partial', 'crop',
                        'combined_wheat', 'tree', 'sleep', 'survey', 'generalization',
                        'cobblestone_generator',
                        'fishing',
                        'kill_zone',
                        'iron_farm', 'reset'
                ]
                if (!supportedModes.contains(requestedMode)) {
                    throw new GradleException(
                            "Unsupported mcmcpFixturePhase5Mode '${requestedMode}'; expected one of ${supportedModes}")
                }

                programArgument '--quickPlaySingleplayer'
                programArgument 'New World'
                systemProperty 'mcmcp.fixture.phase5.mode', requestedMode
            }
        }

        serverSmoke {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server-smoke')
            loadedMods = [mods."${mod_id}"]
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/game-test-server')
            loadedMods = [mods."${fixture_mod_id}"]
            systemProperty 'mcmcp.testHarness', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', fixture_mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }
}

dependencies {
    harnessImplementation sourceSets.main.output
    harnessTestImplementation sourceSets.harness.output
    adminBridgeTestImplementation sourceSets.adminBridge.output

    // Optional at runtime. The production pack supplies both the API and implementation;
    // MCMCP is still usable without an audio path in single-player test environments.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
    testRuntimeOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'

    testImplementation enforcedPlatform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    harnessTestImplementation enforcedPlatform('org.junit:junit-bom:5.14.1')
    harnessTestImplementation 'org.junit.jupiter:junit-jupiter'
    harnessTestImplementation 'org.assertj:assertj-core:3.27.3'
    harnessTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    adminBridgeTestImplementation enforcedPlatform('org.junit:junit-bom:5.14.1')
    adminBridgeTestImplementation 'org.junit.jupiter:junit-jupiter'
    adminBridgeTestImplementation 'org.assertj:assertj-core:3.27.3'
    adminBridgeTestImplementation 'com.google.code.gson:gson:2.14.0'
    adminBridgeTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def mainMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir mainMetadata
neoForge.ideSyncTask mainMetadata

def harnessMetadata = tasks.register('generateHarnessModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            fixture_mod_id         : fixture_mod_id,
            fixture_mod_name       : fixture_mod_name,
            fixture_mod_description: fixture_mod_description,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/harness/templates'
    into 'build/generated/sources/harnessModMetadata'
}
sourceSets.harness.resources.srcDir harnessMetadata
neoForge.ideSyncTask harnessMetadata

def adminBridgeMetadata = tasks.register('generateAdminBridgeModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neo_version                  : neo_version,
            admin_bridge_mod_id           : admin_bridge_mod_id,
            admin_bridge_mod_name         : admin_bridge_mod_name,
            admin_bridge_mod_description  : admin_bridge_mod_description,
            mod_license                  : mod_license,
            mod_version                  : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/adminBridge/templates'
    into 'build/generated/sources/adminBridgeModMetadata'
}
sourceSets.adminBridge.resources.srcDir adminBridgeMetadata
neoForge.ideSyncTask adminBridgeMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // NeoForge's unit-test discovery also sees the harness mod. Explicitly opt it
    // in for tests so the documented plain `gradlew test` command is reproducible.
    systemProperty 'mcmcp.testHarness', 'true'
    systemProperty 'mcmcp.projectDir', projectDir.absolutePath
}

def harnessTest = tasks.register('harnessTest', Test) {
    group = 'verification'
    description = 'Runs pure unit tests for development-only harness configuration.'
    testClassesDirs = sourceSets.harnessTest.output.classesDirs
    classpath = sourceSets.harnessTest.runtimeClasspath
}

def adminBridgeTest = tasks.register('adminBridgeTest', Test) {
    group = 'verification'
    description = 'Runs pure unit tests for the external fixture loader and command policy.'
    testClassesDirs = sourceSets.adminBridgeTest.output.classesDirs
    classpath = sourceSets.adminBridgeTest.runtimeClasspath
}

tasks.register('harnessJar', Jar) {
    group = 'verification'
    description = 'Builds the development-only single-player fixture mod.'
    archiveClassifier = 'test-harness'
    from sourceSets.harness.output
    manifest {
        attributes('Automatic-Module-Name': 'dev.aod.mcmcp.fixture')
    }
}

tasks.register('adminBridgeJar', Jar) {
    group = 'verification'
    description = 'Builds the development-only authenticated fixture admin bridge mod.'
    archiveClassifier = 'fixture-admin'
    from sourceSets.adminBridge.output
    manifest {
        attributes('Automatic-Module-Name': 'dev.aod.mcmcp.adminbridge')
    }
}

def verifyHarnessIsolation = tasks.register('verifyHarnessIsolation') {
    group = 'verification'
    description = 'Verifies that production and destructive fixture classes remain in separate JARs.'
    dependsOn tasks.named('jar'), tasks.named('harnessJar'), tasks.named('adminBridgeJar')

    def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def fixtureJar = tasks.named('harnessJar', Jar).flatMap { it.archiveFile }
    def adminBridgeJar = tasks.named('adminBridgeJar', Jar).flatMap { it.archiveFile }
    inputs.files(productionJar, fixtureJar, adminBridgeJar)

    doLast {
        def productionEntries = new JarFile(productionJar.get().asFile, false).withCloseable { jar ->
            jar.entries().collect { it.name }.toSet()
        }
        def fixtureEntries = new JarFile(fixtureJar.get().asFile, false).withCloseable { jar ->
            jar.entries().collect { it.name }.toSet()
        }
        def adminBridgeEntries = new JarFile(adminBridgeJar.get().asFile, false).withCloseable { jar ->
            jar.entries().collect { it.name }.toSet()
        }
        def fixturePrefix = 'dev/aod/mcmcp/fixture/'
        def adminBridgePrefix = 'dev/aod/mcmcp/adminbridge/'

        def leakedFixtureEntries = productionEntries.findAll { it.startsWith(fixturePrefix) }
        if (!leakedFixtureEntries.isEmpty()) {
            throw new GradleException(
                    "Production JAR contains harness-only entries: ${leakedFixtureEntries.sort()}")
        }
        def leakedAdminEntries = productionEntries.findAll { it.startsWith(adminBridgePrefix) }
        if (!leakedAdminEntries.isEmpty()) {
            throw new GradleException(
                    "Production JAR contains admin-bridge-only entries: ${leakedAdminEntries.sort()}")
        }
        if (!fixtureEntries.contains(fixturePrefix + 'FixturePhase3Autorun.class')) {
            throw new GradleException('Harness JAR is missing FixturePhase3Autorun.class')
        }
        if (fixtureEntries.contains('dev/aod/mcmcp/McmcpMod.class')) {
            throw new GradleException('Harness JAR unexpectedly contains the production mod entrypoint')
        }
        if (fixtureEntries.any { it.startsWith(adminBridgePrefix) }) {
            throw new GradleException('Harness JAR unexpectedly contains admin bridge classes')
        }
        if (!adminBridgeEntries.contains(adminBridgePrefix + 'McmcpFixtureAdminMod.class')) {
            throw new GradleException('Admin bridge JAR is missing its mod entrypoint')
        }
        if (adminBridgeEntries.any { it.startsWith(fixturePrefix) }
                || adminBridgeEntries.contains('dev/aod/mcmcp/McmcpMod.class')) {
            throw new GradleException('Admin bridge JAR unexpectedly contains production or harness classes')
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyHarnessIsolation, harnessTest, adminBridgeTest
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    from('NOTICE.md') { into 'META-INF' }
    manifest {
        attributes('Automatic-Module-Name': 'dev.aod.mcmcp',
                'Implementation-Version': project.version)
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
