import java.lang.module.ModuleFinder
import java.net.URI
import java.nio.file.FileSystems
import java.nio.file.Files
import java.nio.file.StandardOpenOption
import java.util.jar.JarFile
import java.util.jar.Manifest

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

sourceSets {
    harness
    harnessTest {
        java.setSrcDirs(['src/harness/test/java'])
        resources.setSrcDirs([])
    }
}

configurations {
    harnessImplementation.extendsFrom implementation
    harnessRuntimeOnly.extendsFrom runtimeOnly
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    // The official binary-patch pipeline avoids a 4 GiB decompiler process and is
    // sufficient for compiling and testing this client mod on constrained machines.
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    addModdingDependenciesTo sourceSets.harness

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${fixture_mod_id}" {
            sourceSet sourceSets.harness
        }
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            loadedMods = [mods."${mod_id}"]
        }

        harnessClient {
            client()
            gameDirectory = file('run/harness-client')
            loadedMods = [mods."${mod_id}", mods."${fixture_mod_id}"]
            systemProperty 'craftagent.testHarness', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', fixture_mod_id

            def phase3Mode = providers.gradleProperty('craftagentFixturePhase3Mode')
                    .map { value -> value.strip().toLowerCase(Locale.ROOT) }
            if (phase3Mode.isPresent()) {
                def requestedMode = phase3Mode.get()
                def supportedModes = [
                        'navigate', 'break', 'place', 'lever', 'cow', 'reset',
                        'all_satisfied', 'mutations', 'waterlogged', 'directional_stairs',
                        'hopper', 'shortage', 'divergence', 'hidden'
                ]
                if (!supportedModes.contains(requestedMode)) {
                    throw new GradleException(
                            "Unsupported craftagentFixturePhase3Mode '${requestedMode}'; expected one of ${supportedModes}")
                }

                programArgument '--quickPlaySingleplayer'
                programArgument 'New World'
                systemProperty 'craftagent.fixture.phase3.mode', requestedMode
                if (requestedMode != 'reset') {
                    systemProperty 'craftagent.fixture.phase3.autoArm', 'true'
                }
            }

            def phase5Mode = providers.gradleProperty('craftagentFixturePhase5Mode')
                    .map { value -> value.strip().toLowerCase(Locale.ROOT) }
            if (phase5Mode.isPresent()) {
                if (phase3Mode.isPresent()) {
                    throw new GradleException(
                            'craftagentFixturePhase3Mode and craftagentFixturePhase5Mode are mutually exclusive')
                }
                def requestedMode = phase5Mode.get()
                def supportedModes = [
                        'recipes', 'craft', 'transfer', 'crop',
                        'tree', 'sleep', 'survey', 'iron_farm', 'reset'
                ]
                if (!supportedModes.contains(requestedMode)) {
                    throw new GradleException(
                            "Unsupported craftagentFixturePhase5Mode '${requestedMode}'; expected one of ${supportedModes}")
                }

                programArgument '--quickPlaySingleplayer'
                programArgument 'New World'
                systemProperty 'craftagent.fixture.phase5.mode', requestedMode
                if (!['recipes', 'reset'].contains(requestedMode)) {
                    systemProperty 'craftagent.fixture.phase5.autoArm', 'true'
                }
            }
        }

        serverSmoke {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server-smoke')
            loadedMods = [mods."${mod_id}"]
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/game-test-server')
            loadedMods = [mods."${fixture_mod_id}"]
            systemProperty 'craftagent.testHarness', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', fixture_mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }
}

dependencies {
    harnessImplementation sourceSets.main.output
    harnessTestImplementation sourceSets.harness.output

    // Optional at runtime. The production pack supplies both the API and implementation;
    // CraftAgent is still usable without an audio path in single-player test environments.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
    testRuntimeOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'

    // The MCP SDK uses Jackson 3 (tools.jackson.*), avoiding NeoForge's Jackson 2 packages.
    // Jar-in-Jar keeps the production mod self-contained; exact versions are intentional
    // until the final-JAR compatibility gate has passed.
    jarJar(implementation("io.modelcontextprotocol.sdk:mcp-core:${mcp_sdk_version}")) {
        version {
            strictly "[${mcp_sdk_version}]"
            prefer mcp_sdk_version
        }
    }
    jarJar(implementation("io.modelcontextprotocol.sdk:mcp-json-jackson3:${mcp_sdk_version}")) {
        version {
            strictly "[${mcp_sdk_version}]"
            prefer mcp_sdk_version
        }
    }
    jarJar(implementation("org.apache.tomcat.embed:tomcat-embed-core:11.0.24")) {
        version {
            strictly '[11.0.24]'
            prefer '11.0.24'
        }
    }

    // ModDevGradle embeds only dependencies named on jarJar. Keep the MCP runtime's
    // non-Minecraft transitive closure explicit so the production mod does not rely
    // on the development classpath. SLF4J is intentionally supplied by NeoForge.
    [
            ['com.fasterxml.jackson.core:jackson-annotations:2.20', '2.20'],
            ['io.projectreactor:reactor-core:3.7.0', '3.7.0'],
            ['org.reactivestreams:reactive-streams:1.0.4', '1.0.4'],
            ['tools.jackson.core:jackson-databind:3.0.3', '3.0.3'],
            ['tools.jackson.core:jackson-core:3.0.3', '3.0.3'],
            ['com.networknt:json-schema-validator:3.0.0', '3.0.0'],
            ['com.ethlo.time:itu:1.14.0', '1.14.0'],
            ['tools.jackson.dataformat:jackson-dataformat-yaml:3.0.3', '3.0.3'],
            ['org.snakeyaml:snakeyaml-engine:2.10', '2.10'],
            ['org.apache.tomcat:tomcat-annotations-api:11.0.24', '11.0.24'],
    ].each { bundled ->
        jarJar(implementation(bundled[0])) {
            version {
                strictly "[${bundled[1]}]"
                prefer bundled[1]
            }
        }
    }

    testImplementation enforcedPlatform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    harnessTestImplementation enforcedPlatform('org.junit:junit-bom:5.14.1')
    harnessTestImplementation 'org.junit.jupiter:junit-jupiter'
    harnessTestImplementation 'org.assertj:assertj-core:3.27.3'
    harnessTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def mainMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir mainMetadata
neoForge.ideSyncTask mainMetadata

def harnessMetadata = tasks.register('generateHarnessModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            fixture_mod_id         : fixture_mod_id,
            fixture_mod_name       : fixture_mod_name,
            fixture_mod_description: fixture_mod_description,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/harness/templates'
    into 'build/generated/sources/harnessModMetadata'
}
sourceSets.harness.resources.srcDir harnessMetadata
neoForge.ideSyncTask harnessMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // NeoForge's unit-test discovery also sees the harness mod. Explicitly opt it
    // in for tests so the documented plain `gradlew test` command is reproducible.
    systemProperty 'craftagent.testHarness', 'true'
}

def harnessTest = tasks.register('harnessTest', Test) {
    group = 'verification'
    description = 'Runs pure unit tests for development-only harness configuration.'
    testClassesDirs = sourceSets.harnessTest.output.classesDirs
    classpath = sourceSets.harnessTest.runtimeClasspath
}

// MCP Java SDK 2.0.0 publishes invalid Automatic-Module-Name values containing
// hyphens in both artifacts (https://github.com/modelcontextprotocol/java-sdk/issues/560).
// Patch only ModDevGradle's copied JiJ outputs so the Gradle cache remains untouched
// and META-INF/jarjar/metadata.json retains the upstream GAV and version constraints.
tasks.named('jarJar').configure {
    def moduleNameFixes = [
            [
                    file  : 'mcp-core-2.0.0.jar',
                    broken: 'io.modelcontextprotocol.sdk.mcp-core',
                    fixed : 'io.modelcontextprotocol.sdk.mcp.core',
            ],
            [
                    file  : 'mcp-json-jackson3-2.0.0.jar',
                    broken: 'io.modelcontextprotocol.sdk.mcp-json-jackson3',
                    fixed : 'io.modelcontextprotocol.sdk.mcp.json.jackson3',
            ],
    ]
    inputs.property('craftagent.mcpAutomaticModuleNameFixes',
            moduleNameFixes.collectEntries { fix ->
                [(fix.file): "${fix.broken}->${fix.fixed}"]
            })

    doLast {
        moduleNameFixes.each { fix ->
            File nestedJar = outputDirectory
                    .file("META-INF/jarjar/${fix.file}")
                    .get().asFile
            if (!nestedJar.isFile()) {
                throw new GradleException("Expected MCP JiJ artifact is missing: ${nestedJar}")
            }

            Manifest manifest = new JarFile(nestedJar, false).withCloseable { jarFile ->
                def entries = jarFile.entries()
                while (entries.hasMoreElements()) {
                    String entryName = entries.nextElement().name.toUpperCase(Locale.ROOT)
                    if (entryName.startsWith('META-INF/')
                            && ['.SF', '.RSA', '.DSA', '.EC'].any { entryName.endsWith(it) }) {
                        throw new GradleException(
                                "Refusing to rewrite signed MCP JiJ artifact ${nestedJar.name}: ${entryName}")
                    }
                }
                jarFile.manifest
            }
            if (manifest == null) {
                throw new GradleException("MCP JiJ artifact has no manifest: ${nestedJar}")
            }

            String currentName = manifest.mainAttributes.getValue('Automatic-Module-Name')
            if (currentName != fix.fixed) {
                if (currentName != fix.broken) {
                    throw new GradleException(
                            "Unexpected Automatic-Module-Name in ${nestedJar.name}: ${currentName}")
                }

                manifest.mainAttributes.putValue('Automatic-Module-Name', fix.fixed)
                def manifestBytes = new ByteArrayOutputStream()
                manifest.write(manifestBytes)

                FileSystems.newFileSystem(
                        URI.create('jar:' + nestedJar.toURI()),
                        [create: 'false']
                ).withCloseable { fileSystem ->
                    Files.write(
                            fileSystem.getPath('/META-INF/MANIFEST.MF'),
                            manifestBytes.toByteArray(),
                            StandardOpenOption.CREATE,
                            StandardOpenOption.TRUNCATE_EXISTING,
                            StandardOpenOption.WRITE
                    )
                }
            }

            def moduleReference = ModuleFinder.of(nestedJar.toPath()).find(fix.fixed)
            if (moduleReference.isEmpty() || !moduleReference.get().descriptor().isAutomatic()) {
                throw new GradleException(
                        "Rewritten MCP JiJ artifact is not the expected automatic module ${fix.fixed}")
            }
        }
    }
}

tasks.register('harnessJar', Jar) {
    group = 'verification'
    description = 'Builds the development-only single-player fixture mod.'
    archiveClassifier = 'test-harness'
    from sourceSets.harness.output
    manifest {
        attributes('Automatic-Module-Name': 'dev.aodaruma.craftagent.fixture')
    }
}

def verifyHarnessIsolation = tasks.register('verifyHarnessIsolation') {
    group = 'verification'
    description = 'Verifies that production and destructive fixture classes remain in separate JARs.'
    dependsOn tasks.named('jar'), tasks.named('harnessJar')

    def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def fixtureJar = tasks.named('harnessJar', Jar).flatMap { it.archiveFile }
    inputs.files(productionJar, fixtureJar)

    doLast {
        def productionEntries = new JarFile(productionJar.get().asFile, false).withCloseable { jar ->
            jar.entries().collect { it.name }.toSet()
        }
        def fixtureEntries = new JarFile(fixtureJar.get().asFile, false).withCloseable { jar ->
            jar.entries().collect { it.name }.toSet()
        }
        def fixturePrefix = 'dev/aodaruma/craftagent/fixture/'

        def leakedFixtureEntries = productionEntries.findAll { it.startsWith(fixturePrefix) }
        if (!leakedFixtureEntries.isEmpty()) {
            throw new GradleException(
                    "Production JAR contains harness-only entries: ${leakedFixtureEntries.sort()}")
        }
        if (!fixtureEntries.contains(fixturePrefix + 'FixturePhase3Autorun.class')) {
            throw new GradleException('Harness JAR is missing FixturePhase3Autorun.class')
        }
        if (fixtureEntries.contains('dev/aodaruma/craftagent/CraftAgentMod.class')) {
            throw new GradleException('Harness JAR unexpectedly contains the production mod entrypoint')
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyHarnessIsolation, harnessTest
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Automatic-Module-Name': 'dev.aodaruma.craftagent')
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
