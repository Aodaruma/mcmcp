name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/release/requirements.txt
      - name: Derive version from tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            VERSION=$(python tools/release/build_release.py --tag "$REF_NAME" --print-version)
          else
            VERSION=$(python tools/release/build_release.py --print-version)
          fi
          printf 'RELEASE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Test and build production JAR
        run: bash gradlew test harnessTest adminBridgeTest verifyHarnessIsolation build -Pmod_version="$RELEASE_VERSION" --console=plain
      - name: Install PDF build dependencies
        run: |
          python -m pip install -r tools/release/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test release tooling
        run: python -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Build and verify distribution
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python tools/release/build_release.py --tag "$REF_NAME"
          else
            python tools/release/build_release.py --version "$RELEASE_VERSION"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          if-no-files-found: error
          path: |
            build/release/*.zip
            build/release/*.sha256
            build/release/README.pdf
            build/libs/mcmcp-neoforge-26.2-${{ env.RELEASE_VERSION }}.jar

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: build
      - name: Publish release immediately
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          args=(--verify-tag --title "MCMCP $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            "build/release/mcmcp-neoforge-26.2-$RELEASE_VERSION.zip" \
            "build/release/mcmcp-neoforge-26.2-$RELEASE_VERSION.zip.sha256" \
            "build/libs/mcmcp-neoforge-26.2-$RELEASE_VERSION.jar" \
            "build/release/README.pdf" "${args[@]}"
